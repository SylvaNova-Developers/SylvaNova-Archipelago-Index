name: Post-merge publish

# After main advances (human merge, auto-merge, or upstream sync):
#   1. Rebuild index.lock with apwm update
#   2. If lock changed, push bot/update-index-lock, wait for validate+fuzz-ok
#      on that commit, then fast-forward main (no PR create — GITHUB_TOKEN/BOT_PAT
#      often cannot open PRs on this repo)
#   3. Optionally hit the SylvaNova lobby /worlds/refresh when secrets exist
#
# Secrets:
#   BOT_PAT              — contents:write for pushes (falls back to GITHUB_TOKEN)
#   LOBBY_REFRESH_URL    — optional, e.g. https://lobby.example/worlds/refresh
#   LOBBY_ADMIN_TOKEN    — optional, X-Api-Key value for that endpoint

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: post-merge-publish
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip when main advanced via our own lockfile publish.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Update index.lock') }}
    steps:
      - name: Checkout index
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Refresh to live main tip
        run: |
          set -euo pipefail
          # workflow_dispatch re-runs pin github.sha; always publish from tip.
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

      - name: Checkout lobby (for apwm)
        uses: actions/checkout@v4
        with:
          repository: SylvaNova-Developers/SylvaNova-Archipelago-Lobby
          path: _lobby

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # apwm is a workspace member; cargo writes artifacts to _lobby/target
          workspaces: _lobby -> target

      - name: Build apwm
        run: cargo build --manifest-path _lobby/apwm/Cargo.toml --features cli --release

      - name: Run apwm update
        run: |
          set -euo pipefail
          # Workspace root is _lobby/, so the binary lands here (not _lobby/apwm/target).
          APWM="$GITHUB_WORKSPACE/_lobby/target/release/apwm"
          if [ ! -x "$APWM" ]; then
            echo "apwm binary missing at $APWM; searching..." >&2
            find "$GITHUB_WORKSPACE/_lobby" -type f -name apwm -perm -111 -print >&2 || true
            exit 1
          fi
          "$APWM" update -i "$GITHUB_WORKSPACE"

      - name: Publish index.lock via bot branch + required checks
        id: lock_pr
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "sylvanova-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Prefer live main tip (re-runs can pin a stale github.sha).
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

          if git diff --quiet -- index.lock; then
            echo "index.lock unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          BRANCH="bot/update-index-lock"
          git checkout -B "$BRANCH"
          git add index.lock
          # Do NOT include [skip ci] — that skips push-triggered workflows too.
          git commit -m "Update index.lock"

          # Push workflows come from this commit — pin gate logic from main.
          git checkout origin/main -- .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m "ci: pin Actions workflows from main for lock CI"
          fi

          git push -u origin "HEAD:refs/heads/${BRANCH}" --force
          SHA=$(git rev-parse HEAD)
          echo "Pushed $BRANCH @ $SHA — waiting for validate + fuzz-ok"

          for _ in $(seq 1 120); do
            RUNS=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" --paginate)
            VALIDATE=$(echo "$RUNS" | jq -r '[.check_runs[] | select(.name=="validate")] | sort_by(.completed_at // .started_at) | last | "\(.status // "missing"):\(.conclusion // "")"')
            FUZZOK=$(echo "$RUNS" | jq -r '[.check_runs[] | select(.name=="fuzz-ok")] | sort_by(.completed_at // .started_at) | last | "\(.status // "missing"):\(.conclusion // "")"')
            echo "validate=$VALIDATE fuzz-ok=$FUZZOK"

            if [ "$VALIDATE" = "completed:success" ] && [ "$FUZZOK" = "completed:success" ]; then
              echo "Required checks green — fast-forwarding main to $SHA"
              git push origin "$SHA:refs/heads/main"
              echo "main updated with index.lock"
              exit 0
            fi
            if echo "$VALIDATE$FUZZOK" | grep -qi 'completed:failure\|completed:cancelled\|completed:timed_out'; then
              echo "Required checks failed (validate=$VALIDATE fuzz-ok=$FUZZOK)" >&2
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for checks on $SHA" >&2
          exit 1

      - name: Refresh lobby (optional)
        env:
          LOBBY_REFRESH_URL: ${{ secrets.LOBBY_REFRESH_URL }}
          LOBBY_ADMIN_TOKEN: ${{ secrets.LOBBY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LOBBY_REFRESH_URL:-}" ] || [ -z "${LOBBY_ADMIN_TOKEN:-}" ]; then
            echo "Lobby refresh skipped (LOBBY_REFRESH_URL / LOBBY_ADMIN_TOKEN not set)"
            exit 0
          fi
          echo "Calling $LOBBY_REFRESH_URL"
          curl -fsS -H "X-Api-Key: ${LOBBY_ADMIN_TOKEN}" "$LOBBY_REFRESH_URL"
          echo
          echo "Lobby refresh OK"

name: Post-merge publish

# After main advances (human merge, auto-merge, or upstream sync):
#   1. Rebuild index.lock with apwm update
#   2. If lock changed, open a bot PR (direct pushes to main are blocked by
#      required status checks) and wait for it to merge
#   3. Optionally hit the SylvaNova lobby /worlds/refresh when secrets exist
#
# Secrets:
#   BOT_PAT              — create/push lockfile PR (falls back to GITHUB_TOKEN)
#   LOBBY_REFRESH_URL    — optional, e.g. https://lobby.example/worlds/refresh
#   LOBBY_ADMIN_TOKEN    — optional, X-Api-Key value for that endpoint

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: post-merge-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip when main advanced via our own lockfile PR merge (squash message
    # contains "Update index.lock"). Do not rely on [skip ci] — that marker
    # also suppresses pull_request CI on the lockfile PR itself.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Update index.lock') }}
    steps:
      - name: Checkout index
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout lobby (for apwm)
        uses: actions/checkout@v4
        with:
          repository: chouticly/SylvaNova-archipelago-lobby
          path: _lobby

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # apwm is a workspace member; cargo writes artifacts to _lobby/target
          workspaces: _lobby -> target

      - name: Build apwm
        run: cargo build --manifest-path _lobby/apwm/Cargo.toml --features cli --release

      - name: Run apwm update
        run: |
          set -euo pipefail
          # Workspace root is _lobby/, so the binary lands here (not _lobby/apwm/target).
          APWM="$GITHUB_WORKSPACE/_lobby/target/release/apwm"
          if [ ! -x "$APWM" ]; then
            echo "apwm binary missing at $APWM; searching..." >&2
            find "$GITHUB_WORKSPACE/_lobby" -type f -name apwm -perm -111 -print >&2 || true
            exit 1
          fi
          "$APWM" update -i "$GITHUB_WORKSPACE"

      - name: Open PR for index.lock if changed
        id: lock_pr
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "sylvanova-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- index.lock; then
            echo "index.lock unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          BRANCH="bot/update-index-lock"
          git checkout -B "$BRANCH"
          git add index.lock
          # Do NOT include [skip ci] — GitHub skips pull_request workflows for
          # that marker, so required checks (validate / fuzz-ok) never appear.
          # Loop prevention uses the "Update index.lock" title/message instead.
          git commit -m "Update index.lock"
          git push -u origin "HEAD:refs/heads/${BRANCH}" --force

          EXISTING=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            PR="$EXISTING"
            echo "Reusing open lockfile PR #$PR"
          else
            BODY='Automated `index.lock` refresh from **Post-merge publish**. Lockfile-only change; PR CI validate + fuzz-ok should pass quickly, then auto-merge.'
            gh pr create --base main --head "$BRANCH" \
              --title "Update index.lock" \
              --body "$BODY"
            PR=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')
            echo "Opened lockfile PR #$PR"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

          # allow_auto_merge is often off — do not rely on --auto. Wait for the
          # required check names, then squash-merge directly.
          echo "Waiting for required checks on PR #$PR, then squash-merging..."
          for _ in $(seq 1 120); do
            STATE=$(gh pr view "$PR" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR merged"
              exit 0
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "PR #$PR was closed without merging" >&2
              exit 1
            fi

            ROLLUP=$(gh pr view "$PR" --json statusCheckRollup \
              --jq '[.statusCheckRollup[] | {name,status,conclusion}]')
            VALIDATE=$(echo "$ROLLUP" | jq -r '.[] | select(.name=="validate") | "\(.status):\(.conclusion // "")"' | head -1)
            FUZZOK=$(echo "$ROLLUP" | jq -r '.[] | select(.name=="fuzz-ok") | "\(.status):\(.conclusion // "")"' | head -1)

            if [ "$VALIDATE" = "COMPLETED:SUCCESS" ] && [ "$FUZZOK" = "COMPLETED:SUCCESS" ]; then
              if gh pr merge "$PR" --squash --delete-branch; then
                echo "Squash-merged PR #$PR"
                exit 0
              fi
              echo "Merge attempt failed; will retry" >&2
            elif echo "$VALIDATE$FUZZOK" | grep -q 'COMPLETED:FAILURE\|COMPLETED:CANCELLED\|COMPLETED:TIMED_OUT'; then
              echo "Required checks failed on PR #$PR (validate=$VALIDATE fuzz-ok=$FUZZOK)" >&2
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for PR #$PR to merge" >&2
          gh pr view "$PR"
          exit 1

      - name: Refresh lobby (optional)
        env:
          LOBBY_REFRESH_URL: ${{ secrets.LOBBY_REFRESH_URL }}
          LOBBY_ADMIN_TOKEN: ${{ secrets.LOBBY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LOBBY_REFRESH_URL:-}" ] || [ -z "${LOBBY_ADMIN_TOKEN:-}" ]; then
            echo "Lobby refresh skipped (LOBBY_REFRESH_URL / LOBBY_ADMIN_TOKEN not set)"
            exit 0
          fi
          echo "Calling $LOBBY_REFRESH_URL"
          curl -fsS -H "X-Api-Key: ${LOBBY_ADMIN_TOKEN}" "$LOBBY_REFRESH_URL"
          echo
          echo "Lobby refresh OK"

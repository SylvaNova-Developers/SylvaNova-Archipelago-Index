name: Sync upstream

# Keep this fork current with ionium-ap/Archipelago-index:main.
# Direct pushes to main are blocked by required status checks (validate,
# fuzz-ok), so sync opens bot/sync-upstream, waits for PR CI, then merges.
#
# Required secret:
#   BOT_PAT — PAT with contents:write + pull-requests:write on this repo.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "sylvanova-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/ionium-ap/Archipelago-index.git
          git fetch upstream main

      - name: Open sync PR and merge
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OUR=$(git rev-parse HEAD)
          THEIR=$(git rev-parse upstream/main)
          if [ "$OUR" = "$THEIR" ]; then
            echo "Already up to date with upstream/main ($OUR)"
            exit 0
          fi
          echo "Local=$OUR upstream=$THEIR"

          BRANCH="bot/sync-upstream"
          git checkout -B "$BRANCH"

          if git merge-base --is-ancestor HEAD upstream/main; then
            echo "Fast-forwarding branch to upstream/main"
            git merge --ff-only upstream/main
          else
            echo "Merging upstream/main into $BRANCH"
            if ! git merge --no-edit -m "Merge ionium-ap/Archipelago-index:main [upstream-sync]" upstream/main; then
              echo "::error::Merge conflict while syncing from ionium-ap/Archipelago-index:main"
              git merge --abort || true
              exit 1
            fi
          fi

          git push -u origin "HEAD:refs/heads/${BRANCH}" --force

          EXISTING=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            PR="$EXISTING"
            echo "Reusing open sync PR #$PR"
          else
            BODY='Automated sync from `ionium-ap/Archipelago-index:main`. PR CI validate + fuzz-ok (fuzz skipped for sync) then merge.'
            gh pr create --base main --head "$BRANCH" \
              --title "Sync upstream Archipelago-index" \
              --body "$BODY"
            PR=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')
            echo "Opened sync PR #$PR"
          fi

          # allow_auto_merge is often off. Wait for required checks, then merge.
          # Prefer a merge commit so upstream history is preserved when possible.
          echo "Waiting for required checks on PR #$PR, then merging..."
          for _ in $(seq 1 120); do
            STATE=$(gh pr view "$PR" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR merged"
              exit 0
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "PR #$PR was closed without merging" >&2
              exit 1
            fi

            ROLLUP=$(gh pr view "$PR" --json statusCheckRollup \
              --jq '[.statusCheckRollup[] | {name,status,conclusion}]')
            VALIDATE=$(echo "$ROLLUP" | jq -r '.[] | select(.name=="validate") | "\(.status):\(.conclusion // "")"' | head -1)
            FUZZOK=$(echo "$ROLLUP" | jq -r '.[] | select(.name=="fuzz-ok") | "\(.status):\(.conclusion // "")"' | head -1)

            if [ "$VALIDATE" = "COMPLETED:SUCCESS" ] && [ "$FUZZOK" = "COMPLETED:SUCCESS" ]; then
              if gh pr merge "$PR" --merge --delete-branch; then
                echo "Merged PR #$PR"
                exit 0
              fi
              if gh pr merge "$PR" --squash --delete-branch; then
                echo "Squash-merged PR #$PR (merge commit unavailable)"
                exit 0
              fi
              echo "Merge attempt failed; will retry" >&2
            elif echo "$VALIDATE$FUZZOK" | grep -q 'COMPLETED:FAILURE\|COMPLETED:CANCELLED\|COMPLETED:TIMED_OUT'; then
              echo "Required checks failed on PR #$PR (validate=$VALIDATE fuzz-ok=$FUZZOK)" >&2
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for PR #$PR to merge" >&2
          gh pr view "$PR"
          exit 1

      - name: Open issue on sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          title="Upstream sync failed ($(date -u +%Y-%m-%d))"
          body="Automated sync from \`ionium-ap/Archipelago-index:main\` failed on run ${{ github.run_id }}.

          See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Likely causes: merge conflict, or required checks failing on the sync PR. Resolve manually, then re-run **Sync upstream**."
          existing=$(gh issue list --state open --search "Upstream sync failed" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || echo "Could not comment on issue #$existing"
          else
            gh issue create --title "$title" --body "$body" || echo "Could not create issue (token may lack issues:write)"
          fi
          exit 0

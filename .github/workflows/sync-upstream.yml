name: Sync upstream

# Keep this fork current with ionium-ap/Archipelago-index:main.
#
# Direct pushes to main need required checks (validate, fuzz-ok). Neither
# GITHUB_TOKEN nor a contents-only BOT_PAT can open PRs on this repo, so we:
#   1. Reset to origin/main tip (not a stale workflow_dispatch SHA)
#   2. Merge upstream onto bot/sync-upstream and push (BOT_PAT)
#   3. Auto-resolve safe merge conflicts:
#        - .github/workflows/* (we deleted ionium GitLab triggers)
#        - index.lock (both sides regenerate; take upstream, post-merge refreshes)
#   4. Quarantine unreachable version URLs on changed worlds so one dead
#      release cannot block the whole sync
#   5. Pin .github/workflows + scripts/ci from origin/main onto that branch
#   6. Wait for validate + fuzz-ok on that commit, then FF main
#
# Secrets:
#   BOT_PAT — contents:write so the job can push bot/sync-upstream and main.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "sylvanova-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch remotes
        run: |
          git remote add upstream https://github.com/ionium-ap/Archipelago-index.git
          git fetch upstream main
          git fetch origin main

      - name: Sync via bot branch + required checks
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # workflow_dispatch / re-runs pin github.sha to an old commit. Always
          # sync from the live main tip so bot-branch CI gets current workflows.
          git checkout -B main origin/main
          git reset --hard origin/main

          OUR=$(git rev-parse HEAD)
          THEIR=$(git rev-parse upstream/main)
          if [ "$OUR" = "$THEIR" ]; then
            echo "Already up to date with upstream/main ($OUR)"
            exit 0
          fi
          echo "Local=$OUR upstream=$THEIR"

          BRANCH="bot/sync-upstream"
          git checkout -B "$BRANCH"

          if git merge-base --is-ancestor HEAD upstream/main; then
            echo "Fast-forwarding branch to upstream/main"
            git merge --ff-only upstream/main
          else
            echo "Merging upstream/main into $BRANCH"
            if ! git merge --no-edit -m "Merge ionium-ap/Archipelago-index:main [upstream-sync]" upstream/main; then
              # Common case: we deleted ionium GitLab workflows (trigger.yml,
              # mirror-to-gitlab.yml, …) and upstream still touches them.
              # Keep our deletions for .github/workflows; fail on anything else.
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if [ "${#conflicts[@]}" -eq 0 ]; then
                echo "::error::Merge failed without listed conflicts" >&2
                git merge --abort || true
                exit 1
              fi
              non_wf=0
              for path in "${conflicts[@]}"; do
                case "$path" in
                  .github/workflows/*)
                    echo "Resolving workflow conflict in favor of fork: $path"
                    if git cat-file -e "origin/main:$path" 2>/dev/null; then
                      git checkout origin/main -- "$path"
                    else
                      git rm -f --ignore-unmatch "$path" || rm -f "$path"
                    fi
                    ;;
                  index.lock)
                    # Fork post-merge and upstream both rewrite the lock.
                    # Take upstream for the sync merge; post-merge publish
                    # regenerates index.lock for fork-only worlds afterward.
                    echo "Resolving index.lock conflict using upstream copy"
                    git checkout --theirs -- index.lock
                    git add index.lock
                    ;;
                  *)
                    echo "::error::Unresolved merge conflict (not auto-safe): $path" >&2
                    non_wf=1
                    ;;
                esac
              done
              if [ "$non_wf" -ne 0 ]; then
                git merge --abort || true
                exit 1
              fi
              git add -A
              git commit --no-edit -m "Merge ionium-ap/Archipelago-index:main [upstream-sync]"
            fi
          fi

          # One dead release URL must not freeze sync. Drop unreachable versions
          # (or disable the world if none remain) before required checks run.
          mapfile -t changed_worlds < <(python3 scripts/ci/changed_worlds.py \
            --base origin/main --head HEAD || true)
          if [ "${#changed_worlds[@]}" -gt 0 ]; then
            echo "Quarantine scan for: ${changed_worlds[*]}"
            python3 scripts/ci/quarantine_broken_worlds.py "${changed_worlds[@]}"
            if ! git diff --quiet -- index/; then
              git add index/
              git commit -m "Quarantine unreachable index versions [upstream-sync]"
            fi
          fi

          # Replace workflows with exactly origin/main's set so ionium GitLab
          # workflow files cannot linger after a conflicted merge.
          rm -rf .github/workflows
          mkdir -p .github/workflows
          git checkout origin/main -- .github/workflows/ scripts/ci/
          while IFS= read -r path; do
            if ! git cat-file -e "origin/main:$path" 2>/dev/null; then
              git rm -f --ignore-unmatch "$path" || true
            fi
          done < <(git ls-files .github/workflows)
          if ! git diff --cached --quiet || ! git diff --quiet -- .github/workflows scripts/ci; then
            git add -A .github/workflows scripts/ci
            git diff --cached --quiet || git commit -m "ci: pin Actions workflows and scripts/ci from main"
          fi

          git push -u origin "HEAD:refs/heads/${BRANCH}" --force
          SHA=$(git rev-parse HEAD)
          echo "Pushed $BRANCH @ $SHA — waiting for validate + fuzz-ok check runs"

          for _ in $(seq 1 120); do
            RUNS=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" --paginate)
            VALIDATE=$(echo "$RUNS" | jq -r '[.check_runs[] | select(.name=="validate")] | sort_by(.completed_at // .started_at) | last | "\(.status // "missing"):\(.conclusion // "")"')
            FUZZOK=$(echo "$RUNS" | jq -r '[.check_runs[] | select(.name=="fuzz-ok")] | sort_by(.completed_at // .started_at) | last | "\(.status // "missing"):\(.conclusion // "")"')
            echo "validate=$VALIDATE fuzz-ok=$FUZZOK"

            if [ "$VALIDATE" = "completed:success" ] && [ "$FUZZOK" = "completed:success" ]; then
              echo "Required checks green — fast-forwarding main to $SHA"
              git push origin "$SHA:refs/heads/main"
              echo "main updated"
              exit 0
            fi
            if echo "$VALIDATE$FUZZOK" | grep -qi 'completed:failure\|completed:cancelled\|completed:timed_out'; then
              echo "Required checks failed (validate=$VALIDATE fuzz-ok=$FUZZOK)" >&2
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for checks on $SHA" >&2
          exit 1

      - name: Annotate sync failure
        if: failure()
        run: |
          echo "::error::Upstream sync failed. Re-run Sync upstream (use Run workflow, not Re-run on an old job) after CI on bot/sync-upstream is green."

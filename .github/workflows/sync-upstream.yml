name: Sync upstream

# Keep this fork current with ionium-ap/Archipelago-index:main.
#
# Direct pushes to main need required checks (validate, fuzz-ok). Neither
# GITHUB_TOKEN nor a contents-only BOT_PAT can open PRs on this repo, so we:
#   1. Reset to origin/main tip (not a stale workflow_dispatch SHA)
#   2. Merge upstream onto bot/sync-upstream and push (BOT_PAT)
#   3. Pin .github/workflows from origin/main onto that branch so PR CI uses
#      current gate logic (push workflows come from the branch commit)
#   4. Wait for validate + fuzz-ok on that commit, then FF main
#
# Secrets:
#   BOT_PAT — contents:write so the job can push bot/sync-upstream and main.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "sylvanova-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch remotes
        run: |
          git remote add upstream https://github.com/ionium-ap/Archipelago-index.git
          git fetch upstream main
          git fetch origin main

      - name: Sync via bot branch + required checks
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # workflow_dispatch / re-runs pin github.sha to an old commit. Always
          # sync from the live main tip so bot-branch CI gets current workflows.
          git checkout -B main origin/main
          git reset --hard origin/main

          OUR=$(git rev-parse HEAD)
          THEIR=$(git rev-parse upstream/main)
          if [ "$OUR" = "$THEIR" ]; then
            echo "Already up to date with upstream/main ($OUR)"
            exit 0
          fi
          echo "Local=$OUR upstream=$THEIR"

          BRANCH="bot/sync-upstream"
          git checkout -B "$BRANCH"

          if git merge-base --is-ancestor HEAD upstream/main; then
            echo "Fast-forwarding branch to upstream/main"
            git merge --ff-only upstream/main
          else
            echo "Merging upstream/main into $BRANCH"
            if ! git merge --no-edit -m "Merge ionium-ap/Archipelago-index:main [upstream-sync]" upstream/main; then
              echo "::error::Merge conflict while syncing from ionium-ap/Archipelago-index:main"
              git merge --abort || true
              exit 1
            fi
          fi

          # Push workflows are read from this commit — pin them to origin/main.
          git checkout origin/main -- .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m "ci: pin Actions workflows from main for bot sync CI"
          fi

          git push -u origin "HEAD:refs/heads/${BRANCH}" --force
          SHA=$(git rev-parse HEAD)
          echo "Pushed $BRANCH @ $SHA — waiting for validate + fuzz-ok check runs"

          for _ in $(seq 1 120); do
            RUNS=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" --paginate)
            VALIDATE=$(echo "$RUNS" | jq -r '[.check_runs[] | select(.name=="validate")] | sort_by(.completed_at // .started_at) | last | "\(.status // "missing"):\(.conclusion // "")"')
            FUZZOK=$(echo "$RUNS" | jq -r '[.check_runs[] | select(.name=="fuzz-ok")] | sort_by(.completed_at // .started_at) | last | "\(.status // "missing"):\(.conclusion // "")"')
            echo "validate=$VALIDATE fuzz-ok=$FUZZOK"

            if [ "$VALIDATE" = "completed:success" ] && [ "$FUZZOK" = "completed:success" ]; then
              echo "Required checks green — fast-forwarding main to $SHA"
              git push origin "$SHA:refs/heads/main"
              echo "main updated"
              exit 0
            fi
            if echo "$VALIDATE$FUZZOK" | grep -qi 'completed:failure\|completed:cancelled\|completed:timed_out'; then
              echo "Required checks failed (validate=$VALIDATE fuzz-ok=$FUZZOK)" >&2
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for checks on $SHA" >&2
          exit 1

      - name: Annotate sync failure
        if: failure()
        run: |
          echo "::error::Upstream sync failed. Re-run Sync upstream (use Run workflow, not Re-run on an old job) after CI on bot/sync-upstream is green."

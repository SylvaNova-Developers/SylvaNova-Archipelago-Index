name: PR CI

# Automatic acceptance gate for every PR (replaces maintainer `/ci fuzz`).
# Jobs:
#   discover   — which index/*.toml files changed
#   validate   — TOML + URL checks + apwm changes/download for touched worlds
#   fuzz       — fuzzer gate suite (<20% failure, OptionError ignored) per world
#   auto-merge — merge when validate+fuzz-ok are green (world TOML changes,
#                bot/update-index-lock, or bot/sync-upstream)
#
# Fuzz run floors on GitHub-hosted runners (full upstream uses 5000/500 on
# self-hosted Taskcluster). The failure-rate gate is <20% for this fork.

# Also runs on push to bot/* branches so sync/lock publish can attach the
# required validate/fuzz-ok checks to a commit without opening a PR
# (GITHUB_TOKEN cannot create PRs unless the repo Actions setting allows it).

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [bot/sync-upstream, bot/update-index-lock]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  discover:
    name: discover
    runs-on: ubuntu-latest
    outputs:
      worlds: ${{ steps.list.outputs.worlds }}
      has_worlds: ${{ steps.list.outputs.has_worlds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          worlds=$(python3 scripts/ci/changed_worlds.py \
            --base "origin/${BASE_REF}" \
            --head HEAD \
            --json-array)
          echo "worlds=$worlds" >> "$GITHUB_OUTPUT"
          if [ "$worlds" = "[]" ]; then
            echo "has_worlds=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_worlds=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed worlds: $worlds"

  validate:
    name: validate
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changed world TOMLs
        if: needs.discover.outputs.has_worlds == 'true'
        env:
          WORLDS_JSON: ${{ needs.discover.outputs.worlds }}
        run: |
          set -euo pipefail
          mapfile -t worlds < <(python3 -c 'import json,os; print("\n".join(json.loads(os.environ["WORLDS_JSON"])))')
          AP_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("index.toml","rb"))["archipelago_version"])')"
          rm -rf /tmp/archipelago-validate
          git clone --depth 1 --branch "$AP_VERSION" \
            https://github.com/ArchipelagoMW/Archipelago.git /tmp/archipelago-validate \
            || git clone --depth 1 --branch "v${AP_VERSION}" \
              https://github.com/ArchipelagoMW/Archipelago.git /tmp/archipelago-validate \
            || git clone --depth 1 https://github.com/ArchipelagoMW/Archipelago.git /tmp/archipelago-validate
          python3 scripts/ci/validate_worlds.py \
            --archipelago-dir /tmp/archipelago-validate \
            "${worlds[@]}"

      - name: No world TOML changes
        if: needs.discover.outputs.has_worlds != 'true'
        run: echo "No index/*.toml changes; validate OK"

      - name: Checkout lobby (for apwm)
        if: needs.discover.outputs.has_worlds == 'true'
        uses: actions/checkout@v4
        with:
          repository: chouticly/SylvaNova-archipelago-lobby
          path: _lobby

      - name: Install Rust toolchain
        if: needs.discover.outputs.has_worlds == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: needs.discover.outputs.has_worlds == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # apwm is a workspace member; cargo writes artifacts to _lobby/target
          workspaces: _lobby -> target

      - name: apwm changes + download
        if: needs.discover.outputs.has_worlds == 'true'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          cargo build --manifest-path _lobby/apwm/Cargo.toml --features cli --release
          # Workspace root is _lobby/, so the binary lands here (not _lobby/apwm/target).
          APWM="_lobby/target/release/apwm"
          if [ ! -x "$APWM" ]; then
            echo "apwm binary missing at $APWM; searching..." >&2
            find _lobby -type f -name apwm -perm -111 -print >&2 || true
            exit 1
          fi
          mkdir -p /tmp/apwm-out
          # `apwm changes -f` expects a git remote URL to clone the base index from.
          "$APWM" changes -i . \
            -f "https://github.com/${{ github.repository }}.git" \
            -r "${BASE_REF}" \
            -o /tmp/apwm-out
          if [ -f /tmp/apwm-out/changes.json ]; then
            cat /tmp/apwm-out/changes.json
          fi

  fuzz:
    name: fuzz
    needs: [discover, validate]
    # Skip fuzz for upstream sync (trust ionium CI; full matrix is too heavy).
    if: |
      needs.discover.outputs.has_worlds == 'true'
      && github.head_ref != 'bot/sync-upstream'
      && github.ref_name != 'bot/sync-upstream'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        world: ${{ fromJson(needs.discover.outputs.worlds) }}
        variant:
          - baseline
          - no-restrictive-starts
          - check-gerpocalypse
          - check-item-location-count
          - check-lambda-capture
          - check-placement-item-location-refs
          - check-indirect-conditions
          - check-static-output-placement
          - check-determinism
          - check-collect-accessibility
          - check-ut
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip unzip git build-essential

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fuzz variant
        env:
          APWORLD_NAME: ${{ matrix.world }}
          VARIANT: ${{ matrix.variant }}
          INDEX_ROOT: ${{ github.workspace }}
          FUZZ_RUNS_FULL: "1000"
          FUZZ_RUNS_CHECK: "500"
        run: |
          chmod +x scripts/ci/*.sh
          scripts/ci/run_fuzz_variant.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.world }}-${{ matrix.variant }}
          path: fuzz-report-${{ matrix.world }}-${{ matrix.variant }}.json
          if-no-files-found: ignore

  fuzz-ok:
    name: fuzz-ok
    needs: [discover, fuzz]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Require fuzz success when worlds changed
        run: |
          set -euo pipefail
          has="${{ needs.discover.outputs.has_worlds }}"
          result="${{ needs.fuzz.result }}"
          # On push events github.head_ref is empty; fuzz is skipped via the
          # job if (ref_name == bot/sync-upstream or no world changes). Treat
          # skipped the same as success so required check fuzz-ok stays green.
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            echo "fuzz gate ok (has_worlds=$has result=$result)"
            exit 0
          fi
          echo "fuzz matrix failed (result=$result)" >&2
          exit 1

  auto-merge:
    name: auto-merge
    needs: [discover, validate, fuzz-ok]
    if: |
      always()
      && needs.discover.result == 'success'
      && needs.validate.result == 'success'
      && needs.fuzz-ok.result == 'success'
      && github.event.pull_request.draft == false
      && (needs.discover.outputs.has_worlds == 'true'
          || github.head_ref == 'bot/update-index-lock'
          || github.head_ref == 'bot/sync-upstream')
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Repo often has allow_auto_merge=false, so merge directly once
          # required checks succeeded in this workflow.
          if [ "$HEAD_REF" = "bot/sync-upstream" ]; then
            if gh pr merge "$PR" --repo "${{ github.repository }}" --merge --delete-branch; then
              echo "Merge-committed PR #$PR"
              exit 0
            fi
          fi
          if gh pr merge "$PR" --repo "${{ github.repository }}" --squash --delete-branch; then
            echo "Squash-merged PR #$PR"
            exit 0
          fi
          if gh pr merge "$PR" --repo "${{ github.repository }}" --auto --squash; then
            echo "Auto-merge queued for PR #$PR"
            exit 0
          fi
          echo "Failed to merge PR #$PR" >&2
          gh pr view "$PR" --repo "${{ github.repository }}"
          exit 1

name: Force merge

# Collaborator override when fuzz-ok fails but validate is green.
# Triggers:
#   - PR comment: `/force-merge` or `r+` (exact first line)
#   - PR label: `force-merge` or `bypass-fuzz`
#
# Still requires the latest `validate` check on the PR head to be success.
# Rulesets bind required checks to workflow job runs, so posting a standalone
# fuzz-ok check run does not satisfy branch protection. Instead we label the
# PR, rerun the PR CI fuzz-ok job (which succeeds when the label is present),
# wait for that job check to go green, then squash-merge.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

jobs:
  force-merge:
    name: force-merge
    if: |
      (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && (
          startsWith(github.event.comment.body, '/force-merge')
          || startsWith(github.event.comment.body, 'r+')
        )
        && (
          github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
      )
      || (
        github.event_name == 'pull_request'
        && (
          github.event.label.name == 'force-merge'
          || github.event.label.name == 'bypass-fuzz'
        )
        && github.event.sender.login != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and authorize
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          LABEL_NAME: ${{ github.event.label.name || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # First line only; allow trailing explanation on later lines.
            cmd=$(printf '%s\n' "$COMMENT_BODY" | head -n1 | tr -d '\r' | sed 's/[[:space:]]*$//')
            case "$cmd" in
              /force-merge|r+|r++)
                reason="comment \`$cmd\` by @$ACTOR"
                ;;
              *)
                echo "Comment is not an exact force-merge command: [$cmd]"
                exit 0
                ;;
            esac
            pr="$ISSUE_NUMBER"
          else
            # Label path: confirm actor has write+ (label events lack author_association).
            perm=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq .permission)
            case "$perm" in
              admin|maintain|write)
                ;;
              *)
                echo "Actor @$ACTOR lacks write permission (got $perm); refusing force-merge" >&2
                exit 1
                ;;
            esac
            reason="label \`$LABEL_NAME\` by @$ACTOR"
            pr="$ISSUE_NUMBER"
          fi

          meta=$(gh pr view "$pr" --repo "$REPO" --json number,url,title,state,isDraft,headRefOid,baseRefName,headRefName)
          state=$(echo "$meta" | jq -r .state)
          draft=$(echo "$meta" | jq -r .isDraft)
          base=$(echo "$meta" | jq -r .baseRefName)
          sha=$(echo "$meta" | jq -r .headRefOid)
          url=$(echo "$meta" | jq -r .url)
          title=$(echo "$meta" | jq -r .title)
          head_ref=$(echo "$meta" | jq -r .headRefName)

          if [ "$state" != "OPEN" ]; then
            echo "PR #$pr is $state; nothing to merge"
            exit 0
          fi
          if [ "$draft" = "true" ]; then
            echo "PR #$pr is draft; refusing force-merge" >&2
            exit 1
          fi
          if [ "$base" != "main" ]; then
            echo "PR #$pr targets $base (expected main); refusing" >&2
            exit 1
          fi

          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Force-merge candidate: #$pr ($title) @ $sha — $reason"

      - name: Require validate green
        if: steps.prep.outputs.pr != ''
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.prep.outputs.sha }}
          PR: ${{ steps.prep.outputs.pr }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" --paginate)
          validate=$(echo "$runs" | jq -r '
            [.check_runs[] | select(.name == "validate")]
            | sort_by(.completed_at // .started_at)
            | last
            | "\(.status // "missing"):\(.conclusion // "")"
          ')
          echo "validate=$validate"
          if [ "$validate" != "completed:success" ]; then
            echo "Refusing force-merge: validate is not green on $SHA ($validate)" >&2
            gh pr comment "$PR" --repo "$REPO" --body \
              "❌ Force-merge blocked: \`validate\` must be green on \`${SHA:0:7}\` (got \`$validate\`)."
            exit 1
          fi

      - name: Ensure PR has force-merge bypass label
        if: steps.prep.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.prep.outputs.pr }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
          case " $labels " in
            *" force-merge "*|*" bypass-fuzz "*)
              echo "Bypass label already present"
              ;;
            *)
              gh pr edit "$PR" --repo "$REPO" --add-label force-merge
              echo "Added force-merge label"
              ;;
          esac

      - name: Confirm PR CI supports fuzz bypass
        if: steps.prep.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.prep.outputs.pr }}
        run: |
          set -euo pipefail
          # pull_request workflows run from main, not the PR head branch.
          workflow=$(gh api "repos/${REPO}/contents/.github/workflows/pr-ci.yml?ref=main" --jq '.content' | base64 -d)
          if ! grep -q 'Check force-merge bypass label' <<< "$workflow"; then
            gh pr comment "$PR" --repo "$REPO" --body \
              "❌ Force-merge blocked: \`main\` does not include the fuzz bypass workflow yet. Merge the force-merge workflow update, then retry \`/force-merge\`."
            exit 1
          fi

      - name: Rerun fuzz-ok job
        if: steps.prep.outputs.pr != ''
        id: rerun
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.prep.outputs.sha }}
          PR: ${{ steps.prep.outputs.pr }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$REPO" --workflow=pr-ci.yml --commit "$SHA" --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No PR CI run found for $SHA" >&2
            gh pr comment "$PR" --repo "$REPO" --body \
              "❌ Force-merge blocked: no \`PR CI\` workflow run found for \`${SHA:0:7}\`. Push a new commit or re-run PR CI, then retry."
            exit 1
          fi
          job_id=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs" --paginate \
            --jq '[.jobs[] | select(.name == "fuzz-ok")] | sort_by(.started_at) | last | .id')
          if [ -z "$job_id" ] || [ "$job_id" = "null" ]; then
            echo "No fuzz-ok job found in run $run_id" >&2
            exit 1
          fi
          echo "Rerunning fuzz-ok job $job_id from PR CI run $run_id"
          gh api --method POST "repos/${REPO}/actions/jobs/${job_id}/rerun"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for fuzz-ok green
        if: steps.prep.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.prep.outputs.sha }}
          PR: ${{ steps.prep.outputs.pr }}
          JOB_ID: ${{ steps.rerun.outputs.job_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            current_sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)
            if [ "$current_sha" != "$SHA" ]; then
              echo "Head advanced from ${SHA:0:7} to ${current_sha:0:7}; aborting" >&2
              gh pr comment "$PR" --repo "$REPO" --body \
                "❌ Force-merge interrupted: PR head advanced to \`${current_sha:0:7}\` while waiting for \`fuzz-ok\`. Retry \`/force-merge\` on the new tip."
              exit 1
            fi

            job_status=$(gh api "repos/${REPO}/actions/jobs/${JOB_ID}" --jq '"\(.status):\(.conclusion // "")"')
            echo "fuzz-ok job status=$job_status"
            case "$job_status" in
              completed:success)
                echo "fuzz-ok job succeeded"
                exit 0
                ;;
              completed:*)
                echo "fuzz-ok job finished with $job_status" >&2
                gh pr comment "$PR" --repo "$REPO" --body \
                  "❌ Force-merge blocked: \`fuzz-ok\` rerun finished with \`$job_status\`. Ensure the PR branch includes the fuzz bypass workflow and retry."
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for fuzz-ok rerun" >&2
          gh pr comment "$PR" --repo "$REPO" --body \
            "❌ Force-merge timed out waiting for \`fuzz-ok\` to rerun on \`${SHA:0:7}\`. Check PR CI and retry."
          exit 1

      - name: Squash-merge PR
        if: steps.prep.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          COMMENT_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.prep.outputs.pr }}
          REASON: ${{ steps.prep.outputs.reason }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ steps.prep.outputs.sha }}
        run: |
          set -euo pipefail

          current_sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)
          if [ "$current_sha" != "$SHA" ]; then
            echo "Head advanced from ${SHA:0:7} to ${current_sha:0:7}; refusing merge" >&2
            GH_TOKEN="$COMMENT_TOKEN" gh pr comment "$PR" --repo "$REPO" --body \
              "❌ Force-merge blocked: head advanced to \`${current_sha:0:7}\` before merge. Retry \`/force-merge\` on the new tip."
            exit 1
          fi

          merged=false
          if gh pr merge "$PR" --repo "$REPO" --squash --delete-branch; then
            merged=true
            echo "Squash-merged PR #$PR"
          elif gh pr merge "$PR" --repo "$REPO" --auto --squash; then
            echo "Auto-merge queued for PR #$PR"
            GH_TOKEN="$COMMENT_TOKEN" gh pr comment "$PR" --repo "$REPO" --body \
              "⏳ Auto-merge queued despite fuzz failure ($REASON). \`validate\` and \`fuzz-ok\` were green on \`${SHA:0:7}\`; fuzz gate was intentionally bypassed by @$ACTOR."
            exit 0
          fi

          if [ "$merged" != true ]; then
            echo "Failed to merge PR #$PR" >&2
            gh pr view "$PR" --repo "$REPO"
            GH_TOKEN="$COMMENT_TOKEN" gh pr comment "$PR" --repo "$REPO" --body \
              "❌ Force-merge requested ($REASON) but merge failed on \`${SHA:0:7}\` even after \`fuzz-ok\` bypass. Check branch rules and \`BOT_PAT\` permissions."
            exit 1
          fi

          GH_TOKEN="$COMMENT_TOKEN" gh pr comment "$PR" --repo "$REPO" --body \
            "✅ Force-merged despite fuzz failure ($REASON). \`validate\` was green on \`${SHA:0:7}\`; fuzz gate was intentionally bypassed by @$ACTOR."
